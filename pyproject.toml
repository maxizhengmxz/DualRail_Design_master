[project]
name = "dtc-dualrail"
version = "0.1.0"
description = "Reusable analysis helpers and notebooks for DTC dual-rail circuit simulations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lmfit>=1.3.4",
    "marimo[recommended]>=0.23.3",
    "matplotlib>=3.10.9",
    "matplotlib-label-lines>=0.8.1",
    "numpy>=2.4.4",
    "pathos>=0.3.5",
    "qutip>=5.2.3",
    "scipy>=1.17.1",
    "scqubits>=4.1.0",
    "threadpoolctl>=3.6.0",
    "xarray>=2026.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    "dtc.py",
    "legacy/notebooks/dtc_dt_comparison.py",
    "legacy/notebooks/dtc_dt_tunable_r.py",
    "legacy/notebooks/dtc_monte_carlo.py",
    "legacy/notebooks/dtc_tracking.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
