schema = "logical-fsim-workflow-v3"

[execution]
data_directory = "data"
cpus_static = 8
cpus_dynamics = 4
recompute_reference = false
recompute_static = false
recompute_dynamics = false

[thresholds]
fidelity = 0.99
leakage = 0.01
sigma_min = 0.85
leakage_gap_mhz = 10.0

[pair_a]
Ej1 = 12.2
Cj1 = 5.0
Ej1_2 = 7.8
Cj1_2 = 5.0
C1 = 354.0
Ej2 = 12.2
Cj2 = 5.0
Ej2_2 = 7.8
Cj2_2 = 5.0
C2 = 434.0
C12 = 2.9
C1r = 15.0
C2r = 15.0
Cr = 531.0
Lr = 1.33

[pair_b]
Ej1 = 12.2
Cj1 = 5.0
Ej1_2 = 7.8
Cj1_2 = 5.0
C1 = 294.0
Ej2 = 12.2
Cj2 = 5.0
Ej2_2 = 7.8
Cj2_2 = 5.0
C2 = 364.0
C12 = 2.9
C1r = 13.0
C2r = 13.0
Cr = 536.31
Lr = 1.3433

[coupler]
EJmax = 24.4
EC = 0.6
d = 0.02
flux = 0.4
ng = 0.0
ncut = 15
truncated_dim = 4

[model]
a2_c_ghz = 0.1
c_b1_ghz = 0.1
a2_c_ff = 3.0
c_b1_ff = 3.0
coupler_junction_capacitance_ff = [0.2, 0.2]
a2_b1_ff = 0.0
anchor_logical_frequency_mhz = 125.0
rail_ncut = 15
rail_truncated_dim = 3
min_assignment_probability = 0.8
min_leakage_gap_mhz = 5.0

[phase1]
ncut_values = [15, 20, 25, 30]
rail_flux_linspace = [0.1, 0.4, 7]
coupler_flux_linspace = [0.0, 0.46, 7]
ncut_tolerance_khz = 50.0
calibration_tolerance_fraction = 0.1
path_samples = 25
minimum_continuity_overlap = 0.5
fixed_basis_levels = 24
fixed_basis_tolerance_fraction = 0.1
pulse_coupler_truncated_dim = 7
rate_tolerance_fraction = 0.05
rate_durations_ns = [20.0, 40.0, 60.0, 80.0, 100.0, 120.0, 140.0, 160.0]
use_direct_reference_on_fit_failure = true
enforce_exit_gate = true

[phase2]
coherent_ceiling_max_time_ns = 600.0
coherent_ceiling_time_samples = 61
minimum_coherent_ceiling = 0.995
candidate_count = 20
adaptive_seed_candidates = 3
maximum_cz_offdiagonal_to_zz_ratio = 0.25
enforce_exit_gate = true

[model.logical_mapping]
logical_zero = "lower"
logical_one = "upper"

[reference]
mode = "computed"
phi_1_linspace = [0.1, 0.4, 31]
phi_2_linspace = [0.1, 0.4, 101]
evals_count = 6

[contours]
segment_a = 0
segment_b = 1
min_hybridization = 0.95

[static]
frequency_a_mhz = [123.0, 124.5, 125.0, 125.5, 126.0, 128.0, 130.0, 131.0]
frequency_b_mhz = [113.0, 115.0, 117.0, 124.5, 125.0, 125.5, 126.0]
coupler_flux_linspace = [0.0, 0.46, 93]

[idle]
frequency_a_mhz = 125.0
frequency_b_mhz = 125.0
coupler_flux = 0.4

[gates.iswap]
frequency_a_mhz = 125.0
frequency_b_mhz = 125.0
coupler_flux = 0.41

[gates.cz]
frequency_a_mhz = 125.0
frequency_b_mhz = 125.0
coupler_flux = 0.43

[pulse]
padding_ns = 20.0
output_samples = 151

[pulse.solver]
atol = 1e-8
rtol = 1e-6
nsteps = 1000000
integrator = "vern9"

[pulse.sweeps]
iswap_exact = [[0.0, 80.0], [0.0, 90.0], [0.0, 100.0], [0.0, 110.0], [0.0, 120.0], [0.0, 130.0], [0.0, 140.0], [0.0, 150.0], [0.0, 160.0], [0.0, 170.0], [0.0, 180.0], [0.0, 190.0], [0.0, 200.0], [0.0, 210.0], [0.0, 220.0], [0.0, 230.0], [0.0, 240.0], [0.0, 250.0], [0.0, 260.0], [0.0, 270.0], [0.0, 280.0], [0.0, 290.0], [0.0, 300.0]]
cz_exact = [[0.0, 50.0], [0.0, 60.0], [0.0, 70.0], [0.0, 80.0], [0.0, 90.0], [0.0, 100.0], [0.0, 110.0], [0.0, 120.0], [0.0, 130.0], [0.0, 140.0], [0.0, 150.0], [0.0, 160.0], [0.0, 170.0], [0.0, 180.0], [0.0, 190.0], [0.0, 200.0], [0.0, 210.0], [0.0, 220.0], [0.0, 230.0], [0.0, 240.0], [0.0, 250.0]]
iswap_smooth = [[5.0, 190.0], [5.0, 210.0], [10.0, 180.0], [10.0, 200.0], [20.0, 170.0], [20.0, 200.0]]
cz_smooth = [[5.0, 180.0], [10.0, 170.0], [20.0, 150.0]]

[trajectory]
